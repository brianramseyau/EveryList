---
# `version` is not just a display string here - Supervisor pulls exactly
# `ghcr.io/brianramseyau/everylist:<version>`, so this must always equal a real
# tag actually published to GHCR (a vX.Y.Z release tag, "v" prefix included -
# not the bare semver). .github/workflows/docker-publish.yml's
# `bump-addon-version` job keeps this in sync on every stable release tag.
name: EveryList
version: "v1.4.0"
slug: everylist
description: Mobile-first, offline-first shopping/task lists — self-hosted, single container
url: https://github.com/brianramseyau/EveryList
image: ghcr.io/brianramseyau/everylist
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Web UI and API
webui: http://[HOST]:[PORT:3000]/
# Ingress lets EveryList open through Home Assistant's own proxied domain (no separate port
# needed through a reverse proxy in front of HA) - additive to the plain port/webui above, which
# stays for anyone not fronting HA with a reverse proxy. ingress_entry deliberately isn't one of
# apps/web's real routes, so it always reaches apps/api's SPA-fallback route (which recognizes it
# and rewrites the shell for the ingress prefix) instead of being served as a static file - see
# foundational/PLAN_27_PHASE_HOME_ASSISTANT_ADDON.md.
ingress: true
ingress_port: 3000
ingress_entry: /_ha-ingress-entry
map:
  - type: addon_config
    path: /config
    read_only: false
options:
  app_url: ""
  app_key: ""
schema:
  app_url: str?
  app_key: password?
