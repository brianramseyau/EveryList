---
# `version` is not just a display string here - Supervisor pulls exactly
# `ghcr.io/brianramseyau/everylist:<version>`, so this must always equal a real
# tag actually published to GHCR (a vX.Y.Z release tag, "v" prefix included -
# not the bare semver). `pnpm prepare-release vX.Y.Z` (scripts/prepare-release.mjs)
# keeps this in sync with each release - run it locally before cutting a tag.
name: EveryList
version: 'v1.5.0'
slug: everylist
description: Mobile-first, offline-first shopping/task lists — self-hosted, single container
url: https://github.com/brianramseyau/EveryList
image: ghcr.io/brianramseyau/everylist
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Off (null) by default - Ingress below is the default way to open EveryList, and a bare
# published port is one more thing to land on a conflicting host port (3000 collides with other
# common self-hosted apps). Still user-configurable: Settings > Add-ons > EveryList > Network
# turns it back on for anyone who wants direct/LAN access without going through HA at all - we
# suggest 3333 in DOCS.md as a value that doesn't collide with the common apps 3000 does.
ports:
  3000/tcp:
ports_description:
  3000/tcp: Optional direct access, off by default - see DOCS.md
webui: http://[HOST]:[PORT:3000]/
# Ingress lets EveryList open through Home Assistant's own proxied domain (no separate port
# needed through a reverse proxy in front of HA) - the default way in now that the port above is
# off by default. ingress_entry points at a real, dedicated SvelteKit route
# (apps/web/src/routes/ha-ingress-entry/) that's deliberately excluded from prerendering, so it
# always reaches apps/api's SPA-fallback route (which recognizes the ingress request and rewrites
# the shell for the ingress prefix) instead of being served as a static file, while still being a
# route the client router recognizes post-hydration instead of 404ing - see
# foundational/PLAN_27_PHASE_HOME_ASSISTANT_ADDON.md. panel_icon gives EveryList a proper icon
# for Home Assistant's own "Show in sidebar" toggle (Settings > Add-ons > EveryList > Info) -
# that toggle is native to any Ingress-enabled add-on, no extra config needed to make it appear.
ingress: true
ingress_port: 3000
ingress_entry: /ha-ingress-entry
panel_icon: mdi:format-list-checks
# Grants access to Supervisor's internal `/auth` endpoint, which validates a submitted
# username/password against Home Assistant's own user accounts (the same flag
# addon-adguard-home sets for its own "sign in with Home Assistant" form) - lets a user link an
# EveryList account to their HA username and sign in with it instead of a separate EveryList
# password. See foundational/PLAN_27_PHASE_HOME_ASSISTANT_ADDON.md. Unrelated to (and not required
# for) the silent implicit sign-in Ingress already supports unconditionally via Supervisor's
# X-Remote-User-* headers.
auth_api: true
map:
  - type: addon_config
    path: /config
    read_only: false
options:
  app_url: ''
  app_key: ''
schema:
  # `str?`, not `url?` - the `?` only makes the *key* optional, not the value: HA's `url` schema
  # type rejects an empty string as "not a valid URL", but "" is this option's actual, documented
  # default (see DOCS.md - "leave it blank for a working zero-config install"). Confirmed live:
  # `url?` broke a fresh install with "Invalid configuration - expected a URL."
  app_url: str?
  app_key: password?
