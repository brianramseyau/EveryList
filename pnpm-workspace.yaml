packages:
  - "apps/*"
  - "packages/*"

overrides:
  # @adonisjs/transmit's compiled controllers import RuntimeException from
  # @poppinss/utils/exception, but its own dependency chain (@boringnode/transmit)
  # pulls in @poppinss/utils@6.10.1, which doesn't export that name — only 7.x
  # does. Without this override, pnpm hoists whichever version wins the (fragile,
  # install-order-dependent) shared-store slot, and when it picks 6.10.1 the SSE
  # endpoint throws SyntaxError on every request. Pinning one version everywhere
  # removes the ambiguity; @boringnode/transmit only uses the (stable, unchanged)
  # `string` module, so 7.x satisfies it too.
  "@poppinss/utils": "^7.0.1"

onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
  - "@swc/core"
  - sharp
  # Needed for apps/desktop's local dev (`pnpm --filter @everylist/desktop start`) and its CI
  # packaging job to actually have a runnable Electron binary — without this, pnpm 10 blocks
  # electron's postinstall (which downloads the ~150 MB runtime) by default. Every other job
  # (test.yml, ci.yml's e2e/docker jobs) sets ELECTRON_SKIP_BINARY_DOWNLOAD=1 so this entry
  # doesn't cost them the download too. See PLAN_22_PHASE_DESKTOP_APP_ELECTRON.md §0/§6.
  - electron
  - electron-builder

