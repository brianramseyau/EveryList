<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>EveryList app icon</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="168" y1="200" x2="400" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)"/>

  <!-- small celebratory sparkle, top-right -->
  <path d="M 420 62 L 428 80 L 446 88 L 428 96 L 420 114 L 412 96 L 394 88 L 412 80 Z"
        fill="#FFFFFF" opacity="0.55"/>

  <!-- clipboard card, tilted for energy -->
  <g transform="translate(246,266) rotate(-7)">
    <!-- drop shadow -->
    <rect x="-112" y="-140" width="236" height="300" rx="26" fill="#0F172A" opacity="0.18" transform="translate(8,12)"/>
    <!-- card body -->
    <rect x="-118" y="-150" width="236" height="300" rx="26" fill="#FFFFFF"/>
    <!-- clipboard clip -->
    <rect x="-30" y="-168" width="60" height="28" rx="10" fill="#0F172A"/>

    <!-- row 1: checked -->
    <rect x="-95" y="-112" width="34" height="34" rx="8" fill="#10B981"/>
    <path d="M -87 -95 L -80 -88 L -68 -104" stroke="#FFFFFF" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-50" y="-103" width="140" height="16" rx="8" fill="#E2E8F0"/>

    <!-- row 2: checked -->
    <rect x="-95" y="-42" width="34" height="34" rx="8" fill="#10B981"/>
    <path d="M -87 -25 L -80 -18 L -68 -34" stroke="#FFFFFF" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-50" y="-33" width="155" height="16" rx="8" fill="#E2E8F0"/>

    <!-- row 3: checked -->
    <rect x="-95" y="28" width="34" height="34" rx="8" fill="#10B981"/>
    <path d="M -87 45 L -80 52 L -68 36" stroke="#FFFFFF" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-50" y="37" width="110" height="16" rx="8" fill="#E2E8F0"/>
  </g>

  <!-- oversized checkmark stamp, sweeping out past the card - the one-up flourish -->
  <path d="M 168 330 L 232 396 L 400 200" fill="none" stroke="#0F172A" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 168 330 L 232 396 L 400 200" fill="none" stroke="url(#checkGrad)" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
