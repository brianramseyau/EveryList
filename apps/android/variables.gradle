ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    androidxSwipeRefreshLayoutVersion = '1.1.0'
    junitVersion = '4.13.2'
    androidxTestCoreVersion = '1.6.1'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // JVM unit tests run through Robolectric (Activities/Preferences/RemoteViews/receivers/plugins
    // without an emulator). 4.17 is the newest release; it supports targetSdk 36 natively.
    robolectricVersion = '4.17'
    // Plugin tests need a stubbed Capacitor Bridge/PluginCall, which aren't easily constructed by
    // hand. Versions align with Robolectric's bundled Mockito where possible.
    mockitoVersion = '5.19.0'
}