apply plugin: 'com.android.application'
// JVM unit-test coverage for the Android app, mirroring the other workspaces'
// coverage gate (see the jacoco block at the bottom of this file). JaCoCo only
// instruments pure-JVM tests here — instrumented tests (androidTest) run on a
// device/emulator and write their own coverage file the offline report can't
// merge without extra plumbing, so they're deliberately out of scope for now.
apply plugin: 'jacoco'

// The Android release stream's own version (foundational/PLAN_35_PHASE_NATIVE_RELEASE_STREAMS.md),
// independent of the server `vX.Y.Z` tag. scripts/prepare-android-release.mjs owns this file. CI
// overrides both values via -P for `android-vX.Y.Z-rc.N` pre-release builds; local dev builds use
// whatever is checked in here.
def androidVersion = new Properties()
file('../version.properties').withInputStream { androidVersion.load(it) }

android {
    namespace = "au.brianramsey.everylist"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "au.brianramsey.everylist"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode must strictly increase release over release, or Android refuses to treat a
        // new AAB as an update. version.properties is the source of truth; prepare-android-release
        // asserts monotonicity when it writes it.
        versionCode project.hasProperty('appVersionCode') ? (appVersionCode as Integer) : (androidVersion['versionCode'] as Integer)
        versionName project.hasProperty('appVersionName') ? appVersionName : androidVersion['versionName']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Checked-in debug keystore (standard debug credentials, not a secret) so every
            // build - local or CI - signs with the same key. Without this, AGP falls back to
            // ~/.android/debug.keystore, which doesn't persist between GitHub Actions runs and
            // was silently getting regenerated with a random key on every tagged release,
            // making each release's APK sign-incompatible with the last and breaking in-place
            // updates ("App not installed").
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // CI decodes the upload keystore and passes these as Gradle properties (see
            // native-build.yml's build-android-release job); the release build type below
            // falls back to unsigned when they're absent so `./gradlew assembleRelease` still
            // works for a local sanity build without needing the real keystore on disk.
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            // Distinct applicationId so a sideloaded debug build installs alongside the Play
            // Store release instead of replacing it — lets a device carry both for testing.
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    // Robolectric runs Activities/Preferences/RemoteViews/receivers/plugins on the JVM (no
    // emulator), which is what lets the coverage gate below measure the app's real behaviour
    // rather than just its few pure helpers. It needs the merged resources/manifest and the
    // Android framework's default return values for unstubbed platform methods.
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                // Robolectric's SDK 36 sandbox reaches into FileDescriptor internals
                // (ApplicationSharedMemory) via reflection; on JDK 21 those packages are
                // strongly encapsulated, so the test JVM needs explicit opens or every
                // Robolectric test fails at environment setup. CI pins JDK 21, same as here.
                jvmArgs(
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
                )
                // Robolectric loads app classes through its own sandbox classloader, which
                // Gradle's default on-the-fly JaCoCo agent skips entirely (classes with no
                // CodeSource) — every Robolectric-run class reported 0% without this. Opting the
                // agent into "no location" classes makes the framework-touching code measurable;
                // the jdk.internal.* exclusion avoids the agent trying to instrument JDK internals
                // it can't re-derive the original bytes for.
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// @aparajita/capacitor-biometric-auth declares com.google.android.material via
// the stock Capacitor plugin template's boilerplate, but never imports it — its
// styles all parent off AppCompat themes, androidx.biometric's POM doesn't pull
// material, and nothing else in this app (a WebView shell) uses it. With
// minifyEnabled false in every build type it would otherwise ship ~3 MB of dead
// dex/resources in each APK/AAB (v1.2.5-rc.1: 9.85 MB vs 6.83 MB before the
// plugin). Drop it from the graph. If a future plugin version ever requires
// material classes, the failure is loud (resource-link error at build time, or
// NoClassDefFoundError at the first biometric prompt) — re-check that plugin's
// android/build.gradle and remove this exclude only after confirming a real
// material import.
configurations.all {
    exclude group: 'com.google.android.material', module: 'material'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$androidxSwipeRefreshLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Robolectric: runs Android framework classes (Activities, SharedPreferences, RemoteViews,
    // BroadcastReceiver, AlarmManager, etc.) on the JVM so the app's real behaviour is testable in
    // CI without an emulator. androidx.test:core provides ApplicationProvider + ActivityScenario
    // under Robolectric (the same APIs the androidTest source set uses).
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    testImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    // Android's org.json is a platform class (not on the JVM unit-test classpath); this provides
    // the same API locally so WidgetJson/WidgetConfigPayload run under plain JUnit.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// --- JVM unit-test coverage gate ------------------------------------------------------------
//
// The Android half of the repo runs its `testDebugUnitTest` suite (app/src/test) under
// **Robolectric**, which brings Activities/Preferences/RemoteViews/BroadcastReceivers/Capacitor
// plugins onto the JVM — so the widget, its popups, its receivers, and the app's plugins are all
// measured here without an emulator. JaCoCo gates the line coverage at `minimum` below.
//
// The gate is a ratchet set just under the current measured line coverage. What remains
// uncovered, and why, is deliberately small and named:
//   - `MainActivity`/`MainActivity$1` (the Capacitor `BridgeActivity` onCreate and its
//     WebViewListener): needs a live Capacitor Bridge/WebView, which isn't constructible in a JVM
//     test. `spaFallbackPath` (the one decision it makes) and `RefreshGestureAwareLayout`'s
//     gesture heuristics were extracted to their own classes precisely so they *are* covered.
//   - A handful of JSONException catch blocks that are genuinely unreachable (e.g. putting a
//     String/boolean into an org.json object never throws) — kept for the callers' IOException-only
//     surface, same "don't add dead code / document the exception" rule as the other workspaces.
//
// Instrumented tests (QuickAddLayoutTest and the androidTest source set) still exist for on-device
// layout/gesture checks and are run by hand (see AGENTS.md — `connectedAndroidTest` uninstalls the
// app), not in CI. Their coverage is not merged into this report. Never lower `minimum` silently —
// a drop is a real regression.
//
// Only the app's own classes count: `classDirectories` points at the `au.brianramsey.everylist`
// package tree produced by compileDebugJavaWithJavac (the rest of debug/classes is generated
// BuildConfig/R plus transitive Capacitor classes, which aren't this app's to cover).
jacoco {
    toolVersion = '0.8.12'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    // Re-run the report whenever the tests re-ran; without these the report task is considered
    // up-to-date and silently skips after a code change.
    outputs.upToDateWhen { false }

    def excludes = [
        // Generated at build time, no source to cover.
        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
    ]
    // `layout.buildDirectory` (not the deprecated `buildDir`) — Gradle 9 removes the old property.
    def buildDirectory = layout.buildDirectory.get().asFile
    classDirectories.setFrom(files(
        fileTree(dir: "$buildDirectory/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: excludes)
    ))
    sourceDirectories.setFrom(files("$projectDir/src/main/java"))
    executionData.setFrom(fileTree(dir: buildDirectory, includes: ['jacoco/testDebugUnitTest.exec']))

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    // Enforce the gate inline rather than via the standalone `jacocoTestCoverageVerification` task,
    // so a plain `./gradlew jacocoTestReport` (and CI's invocation) checks it — one command, one
    // source of truth, no risk of a caller forgetting the verification task.
    doLast {
        def minimum = 0.94d   // fraction of lines; a ratchet just under the current measured value
        def report = reports.xml.outputLocation.get().asFile
        // JaCoCo's report carries a `<!DOCTYPE report PUBLIC "-//JACOCO//DTD Report 1.1//EN" ...>`,
        // which the JAXP default (disallow-doctype-decl=true) rejects; relax that feature and skip
        // the external DTD fetch so the counters can be read without a network/entity resolution.
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', false)
        factory.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
        def doc = factory.newDocumentBuilder().parse(report)
        // Read the report-level LINE counter specifically: `getElementsByTagName` would return
        // every nested method/class/package counter too, and the first LINE one in document order
        // is a single method's, not the total. The report totals are direct children of <report>.
        def root = doc.getDocumentElement()
        def lineCounter = null
        for (int i = 0; i < root.getChildNodes().length; i++) {
            def node = root.getChildNodes().item(i)
            if (node.getNodeType() == org.w3c.dom.Node.ELEMENT_NODE
                && node.getNodeName() == 'counter'
                && node.getAttributes().getNamedItem('type').getNodeValue() == 'LINE') {
                lineCounter = node
                break
            }
        }
        if (lineCounter == null) {
            throw new GradleException('jacocoTestReport.xml had no report-level LINE counter — report format may have changed')
        }
        def missed = lineCounter.getAttributes().getNamedItem('missed').getNodeValue().toBigDecimal()
        def covered = lineCounter.getAttributes().getNamedItem('covered').getNodeValue().toBigDecimal()
        def total = missed + covered
        def ratio = total == 0 ? 1.0d : (covered / total).doubleValue()
        logger.lifecycle(String.format('Android JVM line coverage: %.2f%% (%s/%s) — gate %.0f%%',
            ratio * 100, covered, total, minimum * 100))
        if (ratio < minimum) {
            throw new GradleException(String.format(
                'Android JVM line coverage %.2f%% is below the %.0f%% gate — add tests or lower the gate in apps/android/app/build.gradle',
                ratio * 100, minimum * 100))
        }
    }
}
