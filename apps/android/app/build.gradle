apply plugin: 'com.android.application'

android {
    namespace = "au.brianramsey.everylist"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "au.brianramsey.everylist"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes these from the release tag (see native-build.yml) so every tagged
        // build has a higher versionCode than the last, which Android requires to treat
        // a new APK as an update rather than a downgrade. Defaults here only cover local
        // dev builds, which are never distributed as updates to anyone.
        versionCode project.hasProperty('appVersionCode') ? (appVersionCode as Integer) : 1
        versionName project.hasProperty('appVersionName') ? appVersionName : "0.0.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Checked-in debug keystore (standard debug credentials, not a secret) so every
            // build - local or CI - signs with the same key. Without this, AGP falls back to
            // ~/.android/debug.keystore, which doesn't persist between GitHub Actions runs and
            // was silently getting regenerated with a random key on every tagged release,
            // making each release's APK sign-incompatible with the last and breaking in-place
            // updates ("App not installed").
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // CI decodes the upload keystore and passes these as Gradle properties (see
            // native-build.yml's build-android-release job); the release build type below
            // falls back to unsigned when they're absent so `./gradlew assembleRelease` still
            // works for a local sanity build without needing the real keystore on disk.
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            // Distinct applicationId so a sideloaded debug build installs alongside the Play
            // Store release instead of replacing it — lets a device carry both for testing.
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$androidxSwipeRefreshLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Android's org.json is a platform class (not on the JVM unit-test classpath); this provides
    // the same API locally so WidgetJson/WidgetConfigPayload run under plain JUnit.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
