name: CI

# The PR merge gate — see foundational/PLAN.md §12:
#   1-3. lint / typecheck / test (delegated to test.yml, shared with
#        docker-publish.yml so the two pipelines can't drift apart)
#   4. build both apps and the production Docker image
#   5. smoke test the built image
# Merge is blocked on any failing step (branch protection, configured in
# GitHub repo settings — not expressible in the workflow file itself).

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  e2e:
    name: Playwright E2E (offline sync, accessibility)
    needs: test
    runs-on: ubuntu-latest
    env:
      HOST: 127.0.0.1
      PORT: '3333'
      NODE_ENV: development
      LOG_LEVEL: info
      APP_KEY: ci-3B65vVbNzQY6nqACpAxWnZUX2ZPfL5pI
      APP_URL: http://127.0.0.1:3333
      SESSION_DRIVER: cookie
      LIMITER_STORE: database
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @everylist/shared build

      - name: Install Playwright Chromium
        run: pnpm --filter @everylist/web exec playwright install --with-deps chromium

      - run: pnpm --filter @everylist/web test:e2e

  docker-smoke:
    name: Build image and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: everylist:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the built image
        run: |
          docker run -d --name everylist-ci -p 3000:3000 \
            -e APP_KEY=ci-3B65vVbNzQY6nqACpAxWnZUX2ZPfL5pI \
            everylist:ci

      - name: Wait for it to come up
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never became reachable on :3000"
          exit 1

      - name: Smoke test — API and web app both serve from the one process
        # A fuller Playwright-driven E2E pass against the built container
        # (PLAN.md §11) lands once there are real user journeys to drive;
        # for now this proves the thing Phase 0 is actually responsible
        # for: the single-process image boots and serves both halves.
        run: |
          curl -fsS http://localhost:3000/ | grep -q "EveryList"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"

      - name: Container logs
        if: always()
        run: docker logs everylist-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f everylist-ci || true
