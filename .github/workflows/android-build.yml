name: Android App Build

# Builds and publishes the Capacitor-wrapped Android app, on its own release stream
# (foundational/PLAN_35_PHASE_NATIVE_RELEASE_STREAMS.md) — independent of the server `vX.Y.Z` tag:
#
#   - `android-vX.Y.Z-rc.N` (pre-release testing tags): builds a debug-signed APK, attached as a
#     GitHub Release asset (marked prerelease). Sideload-only — never published to Play.
#   - `android-vX.Y.Z` (real releases): builds a release-signed App Bundle and publishes it to the
#     Play Console's closed testing (alpha) track, plus attaches the AAB to the GitHub Release too.
#     Once that's all green, its `android-vX.Y.Z-rc.N` GitHub Releases for the same version are
#     pruned — they're sideload-only test builds superseded the moment the real release ships.
#
# The version (versionCode/versionName) comes from apps/android/version.properties, owned by
# `pnpm prepare-android-release android-vX.Y.Z` — NOT from the tag. For rc builds this workflow
# overrides both via -P so an rc's code sits below its eventual stable code, same as before.
#
# Cut a release with: `pnpm prepare-android-release android-vX.Y.Z`, merge the PR, then
# `git tag android-vX.Y.Z && git push origin android-vX.Y.Z`.
#
# Required secrets for the release-signed path:
#   - ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     — the upload keystore used to sign the AAB (Play re-signs with its own app signing key
#     under Play App Signing; this is only the upload key).
#   - PLAY_SERVICE_ACCOUNT_JSON — a Google Cloud service account key JSON (plain text) with
#     Release Manager access on the Play Console app, used by the Play publish step.

on:
  push:
    tags: ['android-v*.*.*']

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  meta:
    name: Parse release tag
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.parse.outputs.version_code }}
      version_name: ${{ steps.parse.outputs.version_name }}
      is_rc: ${{ steps.parse.outputs.is_rc }}
    steps:
      - uses: actions/checkout@v4

      - id: parse
        # versionCode must strictly increase release over release, or Android refuses to treat a
        # new APK/AAB as an update. The stable code comes from version.properties (written by
        # prepare-android-release); an rc uses the same formula but with its RC slot (1..98) instead
        # of 99, so every rc sits below the eventual stable build of the same version.
        #
        # version.properties must already name this version — prepare-android-release writes both
        # together, so a mismatch means the tag was cut without running it. Fail rather than ship a
        # build whose embedded version contradicts its release tag.
        run: |
          TAG="${GITHUB_REF_NAME#android-v}"
          BASE="${TAG%%-*}"
          FILE_VERSION=$(grep -E '^versionName=' apps/android/version.properties | cut -d= -f2)
          FILE_CODE=$(grep -E '^versionCode=' apps/android/version.properties | cut -d= -f2)
          if [[ "$FILE_VERSION" != "$BASE" ]]; then
            echo "apps/android/version.properties is v${FILE_VERSION}, but this tag is android-v${TAG}." >&2
            echo "Run \`pnpm prepare-android-release android-v${BASE}\` and merge it first." >&2
            exit 1
          fi
          if [[ "$TAG" == *-rc.* ]]; then
            RC="${TAG##*-rc.}"
            MAJOR="${BASE%%.*}"; REST="${BASE#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
            # Strip the stable +99 slot and re-add the rc slot.
            VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + RC ))
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            VERSION_CODE="$FILE_CODE"
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"

  build-android-debug:
    name: Build Android debug APK (pre-release)
    needs: [test, meta]
    if: needs.meta.outputs.is_rc == 'true'
    runs-on: ubuntu-latest
    env:
      # See test.yml's env block — this job doesn't build apps/desktop either.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @everylist/shared build

      - name: Build web bundle and sync into the native Android project
        run: pnpm --filter @everylist/web run cap:sync

      # packages: 'platform-tools' - the action's own default ('tools platform-tools') installs
      # the long-deprecated standalone `tools` package, which Google has stopped serving from the
      # SDK repository; sdkmanager now fails outright trying to fetch it. AGP pulls whatever
      # platform/build-tools versions it actually needs on its own. See
      # https://github.com/android-actions/setup-android/issues/537
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Assemble debug APK
        working-directory: apps/android
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode=${{ needs.meta.outputs.version_code }} \
            -PappVersionName=${{ needs.meta.outputs.version_name }}

      - name: Rename APK with the release tag, so repeat downloads don't collide
        run: |
          mv apps/android/app/build/outputs/apk/debug/app-debug.apk \
            "apps/android/app/build/outputs/apk/debug/app-debug-${{ needs.meta.outputs.version_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug-*.apk
          if-no-files-found: error

  build-android-release:
    name: Build Android release AAB
    needs: [test, meta]
    if: needs.meta.outputs.is_rc == 'false'
    runs-on: ubuntu-latest
    env:
      # See test.yml's env block — this job doesn't build apps/desktop either.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @everylist/shared build

      - name: Build web bundle and sync into the native Android project
        run: pnpm --filter @everylist/web run cap:sync

      # packages: 'platform-tools' - see the same step's comment in build-android-debug above.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/android/app/release.keystore

      - name: Assemble release AAB
        working-directory: apps/android
        env:
          # ORG_GRADLE_PROJECT_* env vars map straight to Gradle project properties without the
          # values ever appearing on the command line (unlike passing them as -P args).
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PappVersionCode=${{ needs.meta.outputs.version_code }} \
            -PappVersionName=${{ needs.meta.outputs.version_name }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f apps/android/app/release.keystore

      # Turns the newest apps/android/CHANGELOG.md entry's What's new block into the Play
      # release-notes file. Fails the job (before anything reaches Play) if the entry is missing,
      # oversized (>500 chars), still contains Markdown, or is for a different version.
      - name: Generate Play "What's new" release notes
        run: node scripts/android-whats-new.mjs android-v${{ needs.meta.outputs.version_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-whats-new
          path: apps/android/whatsnew
          if-no-files-found: error

  publish-play:
    name: Publish to Play Console (closed testing)
    needs: [meta, build-android-release]
    if: needs.meta.outputs.is_rc == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-aab-release
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: android-whats-new
          path: dist/whatsnew

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.brianramsey.everylist
          releaseFiles: dist/app-release.aab
          track: alpha
          status: completed
          releaseName: android-v${{ needs.meta.outputs.version_name }}
          whatsNewDirectory: dist/whatsnew

  release:
    name: Attach Android builds to the GitHub Release
    needs: [meta, build-android-debug, build-android-release]
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.meta.outputs.is_rc == 'true' }}
          files: |
            dist/android-apk-debug/*.apk
            dist/android-aab-release/*.aab

  prune-prereleases:
    name: Prune superseded Android pre-release tags
    # Only after a real (non-rc) tag's build is fully green, including the Play publish — a
    # failed publish-play run leaves this job skipped rather than pruning test builds a real
    # release didn't actually finish replacing.
    needs: [meta, release, publish-play]
    # `always()` is required, not decorative: without a status function in the `if`, GitHub applies
    # an implicit transitive `success()` gate that sees build-android-debug's expected skip (real
    # releases don't build the rc-only debug APK) several hops up via `release` and skips this job
    # regardless. The needs.*.result checks below are what actually decide whether to prune.
    if: ${{ always() && !cancelled() && needs.meta.outputs.is_rc == 'false' && needs.release.result == 'success' && needs.publish-play.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The action matches by substring on `version` against each prerelease's tag/name. The
      # `android-` prefix keeps it scoped to this stream's prereleases only; the trailing `-` is
      # load-bearing (a bare `1.8.1` would also substring-match `1.8.10-rc.1`).
      #
      # It deletes the GitHub Releases (and their attached assets) only — it does not delete the
      # underlying git tags, so `git tag -l` will still list the pruned rc tags after this runs.
      #
      # Pinned to the v1.0.0 commit SHA, not a tag: that repo publishes only a v1.0.0 tag and a tag
      # is mutable, so a re-pointed v1.0.0 could run changed code with this job's `contents: write`.
      - uses: mlapaglia/delete-prereleases@0f90437118080a69876452776abff6b33310a040 # v1.0.0
        with:
          version: android-v${{ needs.meta.outputs.version_name }}-
          token: ${{ secrets.GITHUB_TOKEN }}
