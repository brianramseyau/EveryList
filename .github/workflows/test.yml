name: Test

# Reusable lint/typecheck/test jobs called by ci.yml — the single source of
# truth for "does this commit pass the PR gate" (branch protection on main
# requires it). docker-publish.yml does NOT call this: it only runs after a
# commit is already on main, where this has already passed. See
# foundational/PLAN_00_FOUNDATIONAL_PLAN.md §12.
#
# Coverage thresholds (100%, per PLAN_00_FOUNDATIONAL_PLAN.md §11) are enforced per-workspace by
# each package's own test config: packages/shared (vitest --coverage) and
# apps/api (c8, scoped to app/**, see apps/api/.c8rc.json) both do; apps/web
# still needs its Vitest coverage config wired up (see PLAN_00_FOUNDATIONAL_PLAN.md's Phase 2
# status note). A plain `test` script per workspace is already the gate once
# a workspace opts in, no separate coverage step needed here.
#
# lint / build-shared / typecheck / test are split into separate jobs (rather
# than one job's sequential steps) so independent work runs in parallel —
# lint doesn't depend on the shared build, and the api/web/desktop/shared
# test suites don't depend on each other. typecheck and the test matrix both
# need packages/shared built first (apps/api and apps/web import its types
# via package.json "exports" -> dist/), so build-shared runs once and hands
# its output to both via an artifact instead of every job rebuilding it.

on:
  workflow_call:

env:
  # Dummy, non-secret values so `node ace test` can boot apps/api (see
  # apps/api/start/env.ts) — CI's SQLite database is an ephemeral tmp file
  # thrown away at the end of the run. Harmless on jobs that don't touch
  # apps/api.
  HOST: 127.0.0.1
  PORT: '3333'
  NODE_ENV: test
  LOG_LEVEL: info
  APP_KEY: ci-3B65vVbNzQY6nqACpAxWnZUX2ZPfL5pI
  APP_URL: http://127.0.0.1:3333
  SESSION_DRIVER: cookie
  LIMITER_STORE: database
  # No job here builds apps/desktop, so none of them have use for Electron's
  # ~150 MB runtime binary — pnpm-workspace.yaml's onlyBuiltDependencies
  # allows electron's postinstall to run (for apps/desktop's own dev/CI use),
  # so without this every job here would pay for that download too. See
  # PLAN_22_PHASE_DESKTOP_APP_ELECTRON.md §6.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm -r lint

  build-shared:
    name: Build packages/shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @everylist/shared build
      - uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
          retention-days: 1

  typecheck:
    name: Typecheck
    needs: build-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
      - run: pnpm -r typecheck

  test:
    name: Test (${{ matrix.workspace }})
    needs: build-shared
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, web, desktop, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist

      - name: Cache Playwright browsers
        if: matrix.workspace == 'web'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: matrix.workspace == 'web'
        # apps/web's component tests run in a real headless browser
        # (vitest-browser-svelte), so its test script below needs it present.
        run: pnpm --filter @everylist/web exec playwright install --with-deps chromium

      - run: pnpm --filter @everylist/${{ matrix.workspace }} test
