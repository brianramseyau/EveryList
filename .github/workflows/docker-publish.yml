name: Docker Publish

# Publishes the EveryList image to GHCR on two triggers:
#
#   - every push to `main`      -> tagged `nightly` (moving, tracks the tip of main)
#   - every pushed tag vX.Y.Z   -> tagged:
#         vX.Y.Z   exact pin, never moves again      (safe to pin forever)
#         vX       major pin, moves to the newest vX.y.z on each release within that major
#                   (safe to pin for "stable, auto-patched within this major")
#         latest   moves to the newest *stable* (non-prerelease) tagged release
#
# A pushed tag like v1.2.3-beta.1 is a prerelease: it still gets an exact vX.Y.Z-beta.1 tag,
# but deliberately does NOT move `latest` or the `vX` major tag, so prereleases can't leak
# into anyone pinned to a major version or tracking `latest`.
#
# This workflow does build-and-push ONLY, deliberately with no test/lint/typecheck gate of
# its own. That gate lives entirely in ci.yml at PR time (test.yml, shared by both so they
# can't drift apart), enforced by branch protection on main - nothing lands on main without
# it passing. Re-running the same suite here on every push/tag would just double deploy time
# for a commit that's already been verified. Tag releases should be cut from a commit that's
# already on main for the same reason - tagging an arbitrary unverified commit bypasses that
# guarantee.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags (nightly / semver exact / semver major / latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/brianramseyau/everylist
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Compute build metadata
        # Baked into the image (ARG/ENV, not read at container startup) and served
        # from GET /api/v1/meta - see foundational/PLAN.md §8/§9 - so the in-app
        # Settings page footer can show exactly what build is running, which matters
        # for anyone tracking a moving tag (nightly or a major-version pin).
        id: buildinfo
        run: |
          echo "version=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.buildinfo.outputs.version }}
            GIT_SHA=${{ steps.buildinfo.outputs.sha }}
            BUILD_DATE=${{ steps.buildinfo.outputs.date }}
          # Unraid is x86_64-only, so single-arch keeps this fast and avoids flaky
          # QEMU-emulated cross-builds of better-sqlite3's native addon. Revisit if
          # there's ever a real arm64 target (e.g. Raspberry Pi self-hosting).
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
