name: Native App Build

# Builds the Capacitor-wrapped iOS/Android apps (foundational/PLAN_13_PHASE_NATIVE_APP_SHELL.md §7)
# on every pushed tag, split by tag shape:
#
#   - `vX.Y.Z-rc.N` (pre-release testing tags): builds a debug-signed Android APK only, attached
#     as a GitHub Release asset (marked prerelease). Sideload-only — never published to Play.
#   - `vX.Y.Z` (real releases): builds a release-signed Android App Bundle and publishes it to the
#     Play Console's internal testing track, plus attaches the AAB to the GitHub Release too. Once
#     that's all green, its `-rc.N` GitHub Releases for the same version are pruned — they're
#     sideload-only test builds superseded the moment the real release ships.
#
# iOS builds an unsigned Simulator-only app on every tag of either shape (no Apple Developer
# Program enrollment yet, which a real device/TestFlight build requires) — installable via
# `xcrun simctl install`, not on a physical device, and not a Play Store concern.
#
# No server URL is baked in (PLAN_13_PHASE_NATIVE_APP_SHELL.md §1 made that runtime-configurable
# via /server-setup), so one build here serves every self-hosted instance.
#
# Required secrets for the release-signed Android path:
#   - ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     — the upload keystore used to sign the AAB (Play re-signs with its own app signing key
#     under Play App Signing; this is only the upload key).
#   - PLAY_SERVICE_ACCOUNT_JSON — a Google Cloud service account key JSON (plain text) with
#     Release Manager access on the Play Console app, used by the Play publish step.

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  meta:
    name: Parse release tag
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.parse.outputs.version_code }}
      version_name: ${{ steps.parse.outputs.version_name }}
      is_rc: ${{ steps.parse.outputs.is_rc }}
    steps:
      - id: parse
        # versionCode must strictly increase release over release, or Android refuses to treat a
        # new APK/AAB as an update. The RC slot keeps every vX.Y.Z-rc.N build's code below the
        # eventual vX.Y.Z release of the same patch (RC=99), and rc.1 < rc.2 < ... within that,
        # capped at 98 pre-release iterations per patch.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          if [[ "$TAG" == *-rc.* ]]; then
            RC="${TAG##*-rc.}"
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            RC=99
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version_code=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + RC))" >> "$GITHUB_OUTPUT"
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"

  build-android-debug:
    name: Build Android debug APK (pre-release)
    needs: [test, meta]
    if: needs.meta.outputs.is_rc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @everylist/shared build

      - name: Build web bundle and sync into the native Android project
        run: pnpm --filter @everylist/web run cap:sync

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Assemble debug APK
        working-directory: apps/android
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode=${{ needs.meta.outputs.version_code }} \
            -PappVersionName=${{ needs.meta.outputs.version_name }}

      - name: Rename APK with the release tag, so repeat downloads don't collide
        run: |
          mv apps/android/app/build/outputs/apk/debug/app-debug.apk \
            "apps/android/app/build/outputs/apk/debug/app-debug-${{ needs.meta.outputs.version_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug-*.apk
          if-no-files-found: error

  build-android-release:
    name: Build Android release AAB
    needs: [test, meta]
    if: needs.meta.outputs.is_rc == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @everylist/shared build

      - name: Build web bundle and sync into the native Android project
        run: pnpm --filter @everylist/web run cap:sync

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/android/app/release.keystore

      - name: Assemble release AAB
        working-directory: apps/android
        env:
          # ORG_GRADLE_PROJECT_* env vars map straight to Gradle project properties without the
          # values ever appearing on the command line (unlike passing them as -P args).
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PappVersionCode=${{ needs.meta.outputs.version_code }} \
            -PappVersionName=${{ needs.meta.outputs.version_name }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f apps/android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish-play:
    name: Publish to Play Console (internal testing)
    needs: [meta, build-android-release]
    if: needs.meta.outputs.is_rc == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-aab-release
          path: dist

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.brianramsey.everylist
          releaseFiles: dist/app-release.aab
          track: internal
          status: completed

  build-ios:
    name: Build iOS Simulator app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @everylist/shared build

      - name: Build web bundle and sync into the native iOS project
        run: pnpm --filter @everylist/web run cap:sync

      - name: Build for the iOS Simulator
        # Capacitor 8's default template resolves its native deps via Swift Package Manager, not
        # CocoaPods — App.xcodeproj (not a .xcworkspace) is the real project, and xcodebuild
        # resolves the SPM graph itself before compiling. No code signing available/needed for a
        # Simulator-only build.
        run: |
          xcodebuild build \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Zip the .app bundle
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r -y "$GITHUB_WORKSPACE/EveryList-ios-simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: EveryList-ios-simulator.zip
          if-no-files-found: error

  build-desktop:
    name: Build desktop app (${{ matrix.os }})
    needs: [test, meta]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Unlike test.yml/ci.yml, this job actually needs Electron's runtime binary — leave
      # ELECTRON_SKIP_BINARY_DOWNLOAD unset here (see pnpm-workspace.yaml's onlyBuiltDependencies
      # comment and PLAN_22_PHASE_DESKTOP_APP_ELECTRON.md §6).
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @everylist/shared build

      - run: pnpm --filter @everylist/web build

      # Matrix builds per-OS not because of native modules (there are none — see §6) but because
      # dmg/nsis/AppImage each need their own OS toolchain.
      - name: Package the desktop app
        working-directory: apps/desktop
        # electron-builder reads `version` from package.json; inject the tag's version rather
        # than hand-bumping a file that would inevitably drift (§6).
        run: |
          npm pkg set version=${{ needs.meta.outputs.version_name }}
          node scripts/copy-renderer.mjs
          pnpm exec electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  release:
    name: Attach builds to the GitHub Release
    needs: [meta, build-android-debug, build-android-release, build-ios, build-desktop]
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.meta.outputs.is_rc == 'true' }}
          files: |
            dist/android-apk-debug/*.apk
            dist/android-aab-release/*.aab
            dist/ios-simulator-build/*.zip
            dist/desktop-macos-latest/*
            dist/desktop-windows-latest/*
            dist/desktop-ubuntu-latest/*

  prune-prereleases:
    name: Prune superseded pre-release tags
    # Only after a real (non-rc) tag's build is fully green, including the Play publish — a
    # failed publish-play run leaves this job skipped rather than pruning test builds a real
    # release didn't actually finish replacing.
    needs: [meta, release, publish-play]
    if: needs.meta.outputs.is_rc == 'false' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # mlapaglia/delete-prereleases matches by substring on the `version` input, e.g. "v1.0.1"
      # matches "v1.0.1-rc.1", "v1.0.1-rc.2", etc. It deletes the GitHub Releases (and their
      # attached assets) only — it does not delete the underlying git tags, so `git tag -l` will
      # still list the pruned rc tags after this runs.
      - uses: mlapaglia/delete-prereleases@v1
        with:
          version: ${{ needs.meta.outputs.version_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
