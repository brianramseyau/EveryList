name: Native App Build

# Builds the Capacitor-wrapped iOS/Android apps (foundational/PHASE13_PLAN.md §7) and attaches
# them as downloadable assets on the GitHub Release for every pushed vX.Y.Z tag — same trigger
# as docker-publish.yml's release path, so a tag produces both the container image and the
# native builds together.
#
# No server URL is baked in (PHASE13_PLAN.md §1 made that runtime-configurable via /server-setup),
# so one build here serves every self-hosted instance.
#
#   - Android: signed release AAB/APK via Gradle, once the ANDROID_KEYSTORE_BASE64 secret (and its
#     companion password/alias secrets) are set in repo settings — see apps/android/app/build.gradle
#     for the signingConfig that reads them. Until those secrets exist, this falls back to a
#     debug-signed APK (sideload-ready, not Play-Store-submission-ready).
#   - iOS: an unsigned Simulator build only (no Apple Developer Program enrollment yet, which a
#     real device/TestFlight-capable build requires) — installable in the iOS Simulator via
#     `xcrun simctl install`, not on a physical device.

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @everylist/shared build

      - name: Build web bundle and sync into the native Android project
        run: pnpm --filter @everylist/web run cap:sync

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses
        # AGP auto-downloads any additional SDK platform/build-tools packages it needs
        # (compileSdk 36, per apps/android/variables.gradle) on first use, but only once the
        # licenses for those packages have been accepted.
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Derive Android version from the pushed tag
        id: version
        # Tags are vX.Y.Z (workflow trigger, above); versionName drops the leading "v" and
        # versionCode uses the run number so it strictly increases across releases, as Play requires.
        run: |
          echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check whether release signing secrets are configured
        # Secrets can't be referenced directly in an `if:` condition (GitHub Actions evaluates it
        # to always-false), so surface presence/absence via a step output instead.
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "has_keystore=$([ -n "$ANDROID_KEYSTORE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decode release signing keystore
        if: steps.signing.outputs.has_keystore == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Assemble signed release bundle + APK
        if: steps.signing.outputs.has_keystore == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Assemble debug APK (no release signing secrets configured yet)
        if: steps.signing.outputs.has_keystore == 'false'
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  build-ios:
    name: Build iOS Simulator app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @everylist/shared build

      - name: Build web bundle and sync into the native iOS project
        run: pnpm --filter @everylist/web run cap:sync

      - name: Build for the iOS Simulator
        # Capacitor 8's default template resolves its native deps via Swift Package Manager, not
        # CocoaPods — App.xcodeproj (not a .xcworkspace) is the real project, and xcodebuild
        # resolves the SPM graph itself before compiling. No code signing available/needed for a
        # Simulator-only build.
        run: |
          xcodebuild build \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Zip the .app bundle
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r -y "$GITHUB_WORKSPACE/EveryList-ios-simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: EveryList-ios-simulator.zip
          if-no-files-found: error

  release:
    name: Attach builds to the GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android-build/app-debug.apk
            dist/android-build/app-release.apk
            dist/android-build/app-release.aab
            dist/ios-simulator-build/EveryList-ios-simulator.zip
