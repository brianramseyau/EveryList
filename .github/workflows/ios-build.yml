name: iOS App Build

# Builds the Capacitor-wrapped iOS app on its own release stream
# (foundational/PLAN_35_PHASE_NATIVE_RELEASE_STREAMS.md) — independent of the server `vX.Y.Z` tag.
#
# Currently unsigned Simulator-only (no Apple Developer Program enrollment, which a real
# device/TestFlight build requires): installable via `xcrun simctl install`, not on a physical
# device, and not an App Store concern. The stream exists now so iOS stops rebuilding on every
# server release and carries real version numbers for a future TestFlight/App Store release.
#
# Cut a release with: `pnpm prepare-ios-release ios-vX.Y.Z`, merge the PR, then
# `git tag ios-vX.Y.Z && git push origin ios-vX.Y.Z`.
#
# No server URL is baked in (PLAN_13_PHASE_NATIVE_APP_SHELL.md §1 made that runtime-configurable
# via /server-setup), so one build here serves every self-hosted instance.

on:
  push:
    tags: ['ios-v*.*.*']

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-ios:
    name: Build iOS Simulator app
    needs: test
    runs-on: macos-latest
    env:
      # See test.yml's env block — this job doesn't build apps/desktop either.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      # The build reads its version from project.pbxproj, which `pnpm prepare-ios-release` writes.
      # A mismatch means the tag was cut without running it, so the built bundle's version would
      # contradict its release tag — fail rather than ship that.
      - name: Verify the project version matches this tag
        run: |
          TAG="${GITHUB_REF_NAME#ios-v}"
          FILE_VERSION=$(grep -m1 -oE 'MARKETING_VERSION = [^;]+' apps/ios/App/App.xcodeproj/project.pbxproj | sed 's/.*= //')
          if [[ "$FILE_VERSION" != "$TAG" ]]; then
            echo "project.pbxproj is v${FILE_VERSION}, but this tag is ios-v${TAG}." >&2
            echo "Run \`pnpm prepare-ios-release ios-v${TAG}\` and merge it first." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @everylist/shared build

      - name: Build web bundle and sync into the native iOS project
        run: pnpm --filter @everylist/web run cap:sync

      - name: Build for the iOS Simulator
        # Capacitor 8's default template resolves its native deps via Swift Package Manager, not
        # CocoaPods — App.xcodeproj (not a .xcworkspace) is the real project, and xcodebuild
        # resolves the SPM graph itself before compiling. No code signing available/needed for a
        # Simulator-only build. The version (MARKETING_VERSION/CURRENT_PROJECT_VERSION) is read
        # from the project file, owned by `pnpm prepare-ios-release`.
        run: |
          xcodebuild build \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Zip the .app bundle
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r -y "$GITHUB_WORKSPACE/EveryList-ios-simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: EveryList-ios-simulator.zip
          if-no-files-found: error

  release:
    name: Attach iOS build to the GitHub Release
    needs: [test, build-ios]
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-build
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
