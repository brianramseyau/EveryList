name: Setup pnpm workspace
description: Checkout, install pnpm + Node, and install workspace dependencies with the pnpm store cache. Shared by every CI job that needs the repo installed.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      # version comes from the root package.json's "packageManager" field

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
